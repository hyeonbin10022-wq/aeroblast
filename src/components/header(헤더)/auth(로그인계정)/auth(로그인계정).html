            <button id="btn-auth-login" class="btn btn-secondary">

                    <p id="auth-modal-desc" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">클라우드 저장/불러오기는 로그인한 회원만 이용할 수 있는 프리미엄 기능입니다.</p>

                    <div id="auth-credentials-fields" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">

                        </div>
                        <label style="font-size: 0.85rem; color: var(--text-muted);">이메일</label>
                        <input type="email" id="auth-input-email" placeholder="you@example.com" autocomplete="email" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);">

                        <input type="password" id="auth-input-password" placeholder="6자 이상" autocomplete="current-password" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);">
                    </div>

                    <div id="auth-otp-step" style="display: none; flex-direction: column; gap: 8px; margin-bottom: 12px;">

                        <label style="font-size: 0.85rem; color: var(--text-muted);">인증번호</label>
                        <input type="text" id="auth-input-otp" placeholder="인증번호" inputmode="numeric" maxlength="20" autocomplete="one-time-code" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); letter-spacing: 4px; text-align: center; font-size: 1.1rem;">

                    <div id="auth-error-msg" style="color: #ef4444; font-size: 0.8rem; margin-bottom: 8px; display: none;"></div>

                    <div id="auth-credentials-buttons" class="modal-buttons" style="display: flex; gap: 8px; margin-top: 12px;">

                    </div>

                    <div id="auth-otp-buttons" class="modal-buttons" style="display: none; gap: 8px; margin-top: 12px;">

                        <button id="btn-otp-verify" class="btn btn-primary" style="flex: 1;">인증 완료</button>

                    <div id="auth-toggle-row" style="text-align: center; margin-top: 14px; font-size: 0.8rem; color: var(--text-muted);">

                        <a href="#" id="auth-toggle-link" style="color: var(--accent-cyan); text-decoration: none;">회원가입</a>
                    </div>
